<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT DISCO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #scene {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

    /* Disco ball */
    #disco-ball-wrap {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex; flex-direction: column; align-items: center;
    }
    #disco-string { width: 2px; height: 16px; background: #888; }
    #disco-ball-img {
      width: 100px; height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.85));
    }

    /* WIDE SOLID BEAMS */
    .wide-beam {
      position: absolute;
      top: 0;
      pointer-events: none;
      z-index: 4;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      transform-origin: top center;
      opacity: 0.68;
      animation: wideBeamSweep var(--sw, 4s) ease-in-out infinite alternate;
    }
    @keyframes wideBeamSweep {
      0%   { transform: translateX(-50%) rotate(var(--from, -15deg)); }
      100% { transform: translateX(-50%) rotate(var(--to,   15deg)); }
    }

    /* THIN BLINKING LINE BEAMS */
    .line-beam {
      position: absolute;
      width: 2px;
      pointer-events: none;
      z-index: 6;
      transform-origin: top center;
      animation:
        lineBeamSweep var(--sw, 3s) ease-in-out infinite alternate,
        lineBeamBlink var(--blink, 0.22s) step-end infinite;
    }
    @keyframes lineBeamSweep {
      0%   { transform: rotate(var(--from, -25deg)); }
      100% { transform: rotate(var(--to,   25deg)); }
    }
    @keyframes lineBeamBlink {
      0%, 58% { opacity: 1; }
      59%, 100% { opacity: 0; }
    }

    /* SIDE BEAMS */
    .side-beam {
      position: absolute;
      height: 2px;
      pointer-events: none;
      z-index: 6;
      animation:
        sideBeamSweep var(--sw, 2.5s) ease-in-out infinite alternate,
        sideBeamBlink var(--blink, 0.18s) step-end infinite;
    }
    .side-beam.from-left  { transform-origin: left center; }
    .side-beam.from-right { transform-origin: right center; }
    @keyframes sideBeamSweep {
      0%   { transform: rotate(var(--from, -15deg)); }
      100% { transform: rotate(var(--to,   15deg)); }
    }
    @keyframes sideBeamBlink {
      0%, 55% { opacity: 1; }
      56%, 100% { opacity: 0; }
    }

    /* Disco floor */
    #disco-floor {
      position: absolute;
      bottom: 155px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: 160px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      background: #111;
      padding: 2px;
      z-index: 3;
      border-radius: 4px;
    }
    .floor-tile {
      border-radius: 2px;
      animation: tileFlash var(--dur, 1.2s) ease-in-out infinite alternate;
      animation-delay: var(--del, 0s);
    }
    @keyframes tileFlash {
      0%   { filter: brightness(0.3); }
      100% { filter: brightness(1.5); }
    }

    /* Cat DJ */
    #cat-dj {
      position: absolute;
      bottom: 300px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      width: 180px;
      filter: drop-shadow(0 0 12px rgba(255,0,255,0.55));
    }

    /* Speaker images */
    .speaker-img {
      position: absolute;
      bottom: 270px;
      width: 120px;
      height: auto;
      z-index: 7;
      object-fit: contain;
      animation: speakerPulse 0.12s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(255,0,255,0.4));
    }
    #spk-left  { left: 30px; }
    #spk-right { right: 30px; }
    @keyframes speakerPulse {
      0%   { transform: scale(1);    filter: drop-shadow(0 0 6px  rgba(255,0,255,0.3)); }
      100% { transform: scale(1.07); filter: drop-shadow(0 0 22px rgba(255,0,255,0.9)) drop-shadow(0 0 8px rgba(0,255,255,0.5)); }
    }

    /* Crowd */
    #crowd-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 220px;
      z-index: 5;
      pointer-events: none;
    }
    .crowd-canvas {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 220px;
    }
    #crowd2 {
      opacity: 0.5;
      transform: scaleX(-1) scaleY(0.82) translateY(14px);
      transform-origin: bottom center;
      filter: brightness(0.35);
    }

    /* Sparkles */
    .sparkle {
      position: absolute; border-radius: 50%;
      pointer-events: none; z-index: 11;
      animation: sparkleFade 0.8s ease-out forwards;
    }
    @keyframes sparkleFade {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translateY(-20px); }
    }

    /* Controls */
    #controls {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 20;
      display: flex; flex-direction: column; gap: 8px;
    }
    .ctrl-btn {
      background: rgba(255,0,255,0.15);
      border: 1px solid #ff00ff;
      color: #ff00ff;
      padding: 8px 16px;
      font-size: 13px; font-weight: bold;
      letter-spacing: 1px; border-radius: 4px;
      cursor: pointer;
      text-shadow: 0 0 6px #ff00ff;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255,0,255,0.4); box-shadow: 0 0 14px rgba(255,0,255,0.6); }
    #clear-btn { border-color: #00ffff; color: #00ffff; text-shadow: 0 0 6px #00ffff; }
    #clear-btn:hover { background: rgba(0,255,255,0.3); box-shadow: 0 0 14px rgba(0,255,255,0.5); }

    /* Title */
    #title {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
      animation: titlePulse 0.5s ease-in-out infinite alternate;
      white-space: nowrap;
    }
    @keyframes titlePulse {
      from { text-shadow: 0 0 8px #ff00ff, 0 0 16px #ff00ff; }
      to   { text-shadow: 0 0 16px #ff00ff, 0 0 32px #ff00ff, 0 0 60px #00ffff; }
    }

    /* Cats */
    .cat {
      position: absolute;
      z-index: 9;
      cursor: grab;
      user-select: none;
      width: 90px; height: 90px;
      object-fit: contain;
    }
    .cat:active { cursor: grabbing; }
  </style>
</head>
<body>
<div id="scene">

  <div id="title">★ CAT DISCO ★</div>

  <!-- Disco ball -->
  <div id="disco-ball-wrap">
    <div id="disco-string"></div>
    <img id="disco-ball-img" src="images/disco-ball.gif" alt="disco ball" />
  </div>

  <!-- WIDE SOLID BEAMS -->
  <div class="wide-beam" style="left:8%;  width:260px; height:120vh; background:#7700aa; --from:-18deg; --to:4deg;  --sw:4.2s;"></div>
  <div class="wide-beam" style="left:18%; width:210px; height:110vh; background:#005577; --from:-8deg;  --to:20deg; --sw:3.1s; animation-delay:0.4s;"></div>
  <div class="wide-beam" style="left:71%; width:230px; height:115vh; background:#775500; --from:-6deg;  --to:22deg; --sw:3.8s; animation-delay:0.7s;"></div>
  <div class="wide-beam" style="left:82%; width:185px; height:110vh; background:#770011; --from:-22deg; --to:6deg;  --sw:2.9s; animation-delay:1s;"></div>
  <div class="wide-beam" style="left:50%; width:160px; height:125vh; background:#002266; --from:-12deg; --to:12deg; --sw:2.5s; animation-delay:0.2s; opacity:0.5;"></div>

  <!-- THIN BLINKING LINE BEAMS -->
  <div class="line-beam" style="left:12%; top:16px; height:150vh; background:#ff00ff; box-shadow:0 0 5px #ff00ff,0 0 2px #fff; --from:-28deg; --to:5deg;  --sw:3.3s; --blink:0.21s;"></div>
  <div class="line-beam" style="left:22%; top:16px; height:150vh; background:#00ffff; box-shadow:0 0 5px #00ffff,0 0 2px #fff; --from:-5deg;  --to:30deg; --sw:2.7s; --blink:0.17s; animation-delay:0.1s;"></div>
  <div class="line-beam" style="left:50%; top:16px; height:150vh; background:#ffff00; box-shadow:0 0 5px #ffff00,0 0 2px #fff; --from:-18deg; --to:18deg; --sw:2.2s; --blink:0.25s; animation-delay:0.3s;"></div>
  <div class="line-beam" style="left:75%; top:16px; height:150vh; background:#00ff88; box-shadow:0 0 5px #00ff88,0 0 2px #fff; --from:-30deg; --to:4deg;  --sw:3.0s; --blink:0.19s; animation-delay:0.15s;"></div>
  <div class="line-beam" style="left:88%; top:16px; height:150vh; background:#ff4400; box-shadow:0 0 5px #ff4400,0 0 2px #fff; --from:-6deg;  --to:28deg; --sw:3.6s; --blink:0.23s; animation-delay:0.05s;"></div>

  <!-- SIDE BEAMS from left -->
  <div class="side-beam from-left" style="left:0; top:190px; width:110%; background:#ff00cc; box-shadow:0 0 5px #ff00cc; --from:-20deg; --to:10deg; --sw:2.3s; --blink:0.16s;"></div>
  <div class="side-beam from-left" style="left:0; top:280px; width:110%; background:#00ffff; box-shadow:0 0 5px #00ffff; --from:-8deg;  --to:25deg; --sw:1.9s; --blink:0.20s; animation-delay:0.07s;"></div>
  <div class="side-beam from-left" style="left:0; top:350px; width:110%; background:#ffff00; box-shadow:0 0 5px #ffff00; --from:-15deg; --to:18deg; --sw:2.8s; --blink:0.13s; animation-delay:0.12s;"></div>

  <!-- SIDE BEAMS from right -->
  <div class="side-beam from-right" style="right:0; top:220px; width:110%; background:#ff4400; box-shadow:0 0 5px #ff4400; --from:-18deg; --to:12deg; --sw:2.1s; --blink:0.18s; animation-delay:0.09s;"></div>
  <div class="side-beam from-right" style="right:0; top:310px; width:110%; background:#aa00ff; box-shadow:0 0 5px #aa00ff; --from:-10deg; --to:22deg; --sw:2.6s; --blink:0.22s; animation-delay:0.04s;"></div>
  <div class="side-beam from-right" style="right:0; top:375px; width:110%; background:#00ff88; box-shadow:0 0 5px #00ff88; --from:-12deg; --to:16deg; --sw:3.1s; --blink:0.15s; animation-delay:0.18s;"></div>

  <!-- Speakers -->
  <img class="speaker-img" id="spk-left"  src="images/speakers.png" alt="speaker" />
  <img class="speaker-img" id="spk-right" src="images/speakers.png" alt="speaker" />

  <!-- Cat DJ -->
  <img id="cat-dj" src="images/cat-dj.gif" alt="Cat DJ" />

  <!-- Disco floor -->
  <div id="disco-floor"></div>

  <!-- Crowd -->
  <div id="crowd-wrap">
    <canvas class="crowd-canvas" id="crowd1"></canvas>
    <canvas class="crowd-canvas" id="crowd2"></canvas>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="ctrl-btn" onclick="rainCats()">MAKE IT RAIN</button>
    <button class="ctrl-btn" onclick="addOneCat()">+ CAT</button>
    <button class="ctrl-btn" id="clear-btn" onclick="clearCats()">CLEAR FLOOR</button>
  </div>

</div>

<script>
  const scene = document.getElementById('scene');
  const floorEl = document.getElementById('disco-floor');

  // Background strobe
  const BG_COLORS = ['#0d0020','#001a22','#1a1100','#1a0008','#00001a','#000','#000','#000','#0d001a','#001510','#000'];
  setInterval(() => { scene.style.background = BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)]; }, 120);

  // Floor tiles
  const TILE_COLORS = ['#ff00ff','#00ffff','#ffff00','#ff4400','#00ff88','#ff0088','#8800ff','#0088ff','#ff8800','#fff','#44ff00','#ff0044','#ff66cc','#66ffff'];
  const randomColor = () => TILE_COLORS[Math.floor(Math.random() * TILE_COLORS.length)];

  for (let i = 0; i < 24; i++) {
    const t = document.createElement('div');
    t.className = 'floor-tile';
    t.style.background = randomColor();
    t.style.setProperty('--dur', (0.4 + Math.random() * 1.2).toFixed(2) + 's');
    t.style.setProperty('--del', (Math.random() * 1.5).toFixed(2) + 's');
    floorEl.appendChild(t);
  }
  setInterval(() => {
    document.querySelectorAll('.floor-tile').forEach(t => { if (Math.random() < 0.4) t.style.background = randomColor(); });
  }, 300);

  // Sparkles from disco ball
  setInterval(() => {
    for (let i = 0; i < 2; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.background = randomColor();
      s.style.left = (28 + Math.random() * 44) + '%';
      s.style.top  = (105 + Math.random() * 30) + 'px';
      const sz = (3 + Math.random() * 5) + 'px';
      s.style.width = s.style.height = sz;
      scene.appendChild(s);
      setTimeout(() => s.remove(), 800);
    }
  }, 220);

  // Crowd silhouette via canvas
  function drawCrowd(canvasId, flip) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      canvas.width  = scene.offsetWidth || window.innerWidth;
      canvas.height = 220;
      ctx.save();
      if (flip) { ctx.scale(-1, 1); ctx.drawImage(img, -canvas.width, 0, canvas.width, canvas.height); }
      else { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }
      ctx.restore();
      const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        if ((d[i] + d[i+1] + d[i+2]) / 3 < 180) {
          d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 255;
        } else { d[i+3] = 0; }
      }
      ctx.putImageData(id, 0, 0);
    };
    img.src = 'images/crowd.png';
  }
  drawCrowd('crowd1', false);
  drawCrowd('crowd2', true);

  // Cats
  const CAT_URLS = [
    'images/cat1.png',
    'images/cat2.png',
    'images/cat3.png',
    'images/cat4.png',
    'images/cat5.png',
  ];

  const cats = [];
  const GRAVITY = 0.38, BOUNCE = 0.52;
  const FLOOR_Y = () => scene.offsetHeight - 280;

  function spawnCat(startX) {
    const img = document.createElement('img');
    img.className = 'cat';
    img.src = CAT_URLS[Math.floor(Math.random() * CAT_URLS.length)];
    const x = startX ?? Math.random() * (scene.offsetWidth - 100);
    img.style.left = x + 'px'; img.style.top = '-100px';
    const cat = { el: img, x, y: -100, vx: (Math.random()-.5)*5, vy: 1+Math.random()*2, dragging: false, lastX:0, lastY:0, throwVx:0, throwVy:0 };
    img.addEventListener('mousedown', e => { cat.dragging=true; cat.lastX=e.clientX; cat.lastY=e.clientY; e.preventDefault(); });
    img.addEventListener('touchstart', e => { cat.dragging=true; cat.lastX=e.touches[0].clientX; cat.lastY=e.touches[0].clientY; e.preventDefault(); }, {passive:false});
    scene.appendChild(img);
    cats.push(cat);
  }

  document.addEventListener('mousemove', e => {
    cats.forEach(cat => {
      if (!cat.dragging) return;
      const dx=e.clientX-cat.lastX, dy=e.clientY-cat.lastY;
      cat.throwVx=dx*0.6; cat.throwVy=dy*0.6;
      cat.x+=dx; cat.y+=dy;
      cat.el.style.left=cat.x+'px'; cat.el.style.top=cat.y+'px';
      cat.lastX=e.clientX; cat.lastY=e.clientY;
    });
  });
  document.addEventListener('touchmove', e => {
    cats.forEach(cat => {
      if (!cat.dragging) return;
      const dx=e.touches[0].clientX-cat.lastX, dy=e.touches[0].clientY-cat.lastY;
      cat.throwVx=dx*0.6; cat.throwVy=dy*0.6;
      cat.x+=dx; cat.y+=dy;
      cat.el.style.left=cat.x+'px'; cat.el.style.top=cat.y+'px';
      cat.lastX=e.touches[0].clientX; cat.lastY=e.touches[0].clientY;
    });
  }, {passive:false});
  document.addEventListener('mouseup',   () => { cats.forEach(cat => { if(cat.dragging){cat.dragging=false;cat.vx=cat.throwVx;cat.vy=cat.throwVy;} }); });
  document.addEventListener('touchend',  () => { cats.forEach(cat => { if(cat.dragging){cat.dragging=false;cat.vx=cat.throwVx;cat.vy=cat.throwVy;} }); });

  function animate() {
    const W = scene.offsetWidth;
    const FY = FLOOR_Y();
    cats.forEach(cat => {
      if (cat.dragging) return;
      cat.vy+=GRAVITY; cat.x+=cat.vx; cat.y+=cat.vy;
      if (cat.y>=FY) { cat.y=FY; cat.vy*=-BOUNCE; cat.vx*=0.9; if(Math.abs(cat.vy)<0.8)cat.vy=0; }
      if (cat.x<0) { cat.x=0; cat.vx*=-0.7; }
      if (cat.x>W-90) { cat.x=W-90; cat.vx*=-0.7; }
      cat.el.style.left=cat.x+'px'; cat.el.style.top=cat.y+'px';
    });
    requestAnimationFrame(animate);
  }

  function rainCats() { const n=5+Math.floor(Math.random()*5); for(let i=0;i<n;i++) setTimeout(()=>spawnCat(),i*160); }
  function addOneCat() { spawnCat(); }
  function clearCats() { cats.forEach(c=>c.el.remove()); cats.length=0; }

  for (let i=0;i<3;i++) setTimeout(()=>spawnCat(),i*500);
  animate();
</script>
</body>
</html>
