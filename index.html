<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT DISCO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #scene {
      width: 100vw; height: 100vh;
      position: relative; overflow: hidden;
      font-family: sans-serif; background: #000;
    }

    #disco-ball-wrap {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      z-index: 12; display: flex; flex-direction: column; align-items: center;
    }
    #disco-string { width: 2px; height: 16px; background: #888; }
    #disco-ball-img {
      width: 100px; height: 100px; object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.85));
    }

    .wide-beam {
      position: absolute; top: 0; pointer-events: none; z-index: 15;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      transform-origin: top center; opacity: 0.68;
      animation: wideBeamSweep var(--sw, 4s) ease-in-out infinite alternate;
    }
    @keyframes wideBeamSweep {
      0%   { transform: translateX(-50%) rotate(var(--from, -15deg)); }
      100% { transform: translateX(-50%) rotate(var(--to, 15deg)); }
    }

    .line-beam {
      position: absolute; width: 2px; pointer-events: none; z-index: 15;
      transform-origin: top center;
      animation: lineBeamSweep var(--sw, 3s) ease-in-out infinite alternate,
                 lineBeamBlink var(--blink, 0.22s) step-end infinite;
    }
    @keyframes lineBeamSweep {
      0%   { transform: rotate(var(--from, -25deg)); }
      100% { transform: rotate(var(--to, 25deg)); }
    }
    @keyframes lineBeamBlink {
      0%, 58% { opacity: 1; } 59%, 100% { opacity: 0; }
    }

    .side-beam {
      position: absolute; height: 2px; pointer-events: none; z-index: 15;
      animation: sideBeamSweep var(--sw, 2.5s) ease-in-out infinite alternate,
                 sideBeamBlink var(--blink, 0.18s) step-end infinite;
    }
    .side-beam.from-left  { transform-origin: left center; }
    .side-beam.from-right { transform-origin: right center; }
    @keyframes sideBeamSweep {
      0%   { transform: rotate(var(--from, -15deg)); }
      100% { transform: rotate(var(--to, 15deg)); }
    }
    @keyframes sideBeamBlink {
      0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; }
    }

    #disco-floor {
      position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%);
      width: 65%; height: 160px;
      display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(3, 1fr);
      gap: 2px; background: #111; padding: 2px; z-index: 3; border-radius: 4px;
    }
    .floor-tile {
      border-radius: 2px;
      animation: tileFlash var(--dur, 1.2s) ease-in-out infinite alternate;
      animation-delay: var(--del, 0s);
    }
    @keyframes tileFlash {
      0%   { filter: brightness(0.3); }
      100% { filter: brightness(1.5); }
    }

    #cat-dj {
      position: absolute; bottom: 315px; left: 50%; transform: translateX(-50%);
      z-index: 8; width: 380px; height: auto;
      image-rendering: auto;
      filter: drop-shadow(0 0 16px rgba(255,0,255,0.7));
    }

    /* HUGE speakers */
    .speaker-canvas {
      position: absolute; bottom: 180px;
      z-index: 7;
      animation: speakerPulse 0.1s ease-in-out infinite alternate;
    }
    #spk-left  { left: -10px; width: 260px; height: 340px; }
    #spk-right { right: -10px; width: 260px; height: 340px; }
    @keyframes speakerPulse {
      0%   { transform: scale(1);    filter: drop-shadow(0 0 8px rgba(255,0,255,0.5)); }
      100% { transform: scale(1.06); filter: drop-shadow(0 0 30px rgba(255,0,255,1)) drop-shadow(0 0 14px rgba(0,255,255,0.7)); }
    }

    /* Crowd - tall, wobbling */
    #crowd-wrap {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 420px; z-index: 5; pointer-events: none;
      display: flex;
    }
    .crowd-canvas {
      position: absolute; bottom: 0;
      height: 420px;
    }
    #crowd1 {
      left: 0; width: 100%;
      animation: crowdSway1 3.2s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    #crowd2 {
      left: 0; width: 100%;
      opacity: 0.5;
      animation: crowdSway2 2.7s ease-in-out infinite alternate;
      transform-origin: bottom center;
      filter: brightness(0.4);
    }
    @keyframes crowdSway1 {
      0%   { transform: scaleY(1)    skewX(0deg); }
      25%  { transform: scaleY(1.04) skewX(1deg); }
      50%  { transform: scaleY(0.97) skewX(-1deg); }
      75%  { transform: scaleY(1.05) skewX(0.5deg); }
      100% { transform: scaleY(1)    skewX(-0.5deg); }
    }
    @keyframes crowdSway2 {
      0%   { transform: scaleX(-1) scaleY(0.95) skewX(1deg); }
      33%  { transform: scaleX(-1) scaleY(1.04) skewX(-1deg); }
      66%  { transform: scaleX(-1) scaleY(0.98) skewX(0.5deg); }
      100% { transform: scaleX(-1) scaleY(1.03) skewX(-0.5deg); }
    }

    .sparkle {
      position: absolute; border-radius: 50%; pointer-events: none; z-index: 11;
      animation: sparkleFade 0.8s ease-out forwards;
    }
    @keyframes sparkleFade {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translateY(-20px); }
    }

    #controls {
      position: absolute; top: 14px; right: 14px; z-index: 20;
      display: flex; flex-direction: column; gap: 8px;
    }
    .ctrl-btn {
      background: rgba(255,0,255,0.15); border: 1px solid #ff00ff;
      color: #ff00ff; padding: 8px 16px; font-size: 13px; font-weight: bold;
      letter-spacing: 1px; border-radius: 4px; cursor: pointer;
      text-shadow: 0 0 6px #ff00ff; transition: all 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255,0,255,0.4); box-shadow: 0 0 14px rgba(255,0,255,0.6); }
    #clear-btn { border-color: #00ffff; color: #00ffff; text-shadow: 0 0 6px #00ffff; }
    #clear-btn:hover { background: rgba(0,255,255,0.3); }

    #title {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 20; color: #fff; font-size: 28px; font-weight: 900;
      letter-spacing: 6px; text-transform: uppercase; white-space: nowrap;
      animation: titlePulse 0.5s ease-in-out infinite alternate;
    }
    @keyframes titlePulse {
      from { text-shadow: 0 0 8px #ff00ff, 0 0 16px #ff00ff; }
      to   { text-shadow: 0 0 16px #ff00ff, 0 0 32px #ff00ff, 0 0 60px #00ffff; }
    }

    .cat {
      position: absolute; z-index: 9; cursor: grab;
      user-select: none; width: 90px; height: 90px; object-fit: contain;
    }
    .cat:active { cursor: grabbing; }
  </style>
</head>
<body>
<div id="scene">

  <div id="title">★ CAT DISCO ★</div>

  <div id="disco-ball-wrap">
    <div id="disco-string"></div>
    <img id="disco-ball-img" src="images/disco-ball.gif" alt="disco ball" />
  </div>

  <!-- Wide beams -->
  <div class="wide-beam" style="left:8%;  width:260px; height:120vh; background:#7700aa; --from:-18deg; --to:4deg;  --sw:4.2s;"></div>
  <div class="wide-beam" style="left:18%; width:210px; height:110vh; background:#005577; --from:-8deg;  --to:20deg; --sw:3.1s; animation-delay:0.4s;"></div>
  <div class="wide-beam" style="left:71%; width:230px; height:115vh; background:#775500; --from:-6deg;  --to:22deg; --sw:3.8s; animation-delay:0.7s;"></div>
  <div class="wide-beam" style="left:82%; width:185px; height:110vh; background:#770011; --from:-22deg; --to:6deg;  --sw:2.9s; animation-delay:1s;"></div>
  <div class="wide-beam" style="left:50%; width:160px; height:125vh; background:#002266; --from:-12deg; --to:12deg; --sw:2.5s; animation-delay:0.2s; opacity:0.5;"></div>

  <!-- Line beams -->
  <div class="line-beam" style="left:12%; top:16px; height:150vh; background:#ff00ff; box-shadow:0 0 5px #ff00ff; --from:-28deg; --to:5deg;  --sw:3.3s; --blink:0.21s;"></div>
  <div class="line-beam" style="left:22%; top:16px; height:150vh; background:#00ffff; box-shadow:0 0 5px #00ffff; --from:-5deg;  --to:30deg; --sw:2.7s; --blink:0.17s; animation-delay:0.1s;"></div>
  <div class="line-beam" style="left:50%; top:16px; height:150vh; background:#ffff00; box-shadow:0 0 5px #ffff00; --from:-18deg; --to:18deg; --sw:2.2s; --blink:0.25s; animation-delay:0.3s;"></div>
  <div class="line-beam" style="left:75%; top:16px; height:150vh; background:#00ff88; box-shadow:0 0 5px #00ff88; --from:-30deg; --to:4deg;  --sw:3.0s; --blink:0.19s; animation-delay:0.15s;"></div>
  <div class="line-beam" style="left:88%; top:16px; height:150vh; background:#ff4400; box-shadow:0 0 5px #ff4400; --from:-6deg;  --to:28deg; --sw:3.6s; --blink:0.23s; animation-delay:0.05s;"></div>

  <!-- Side beams -->
  <div class="side-beam from-left" style="left:0; top:190px; width:110%; background:#ff00cc; box-shadow:0 0 5px #ff00cc; --from:-20deg; --to:10deg; --sw:2.3s; --blink:0.16s;"></div>
  <div class="side-beam from-left" style="left:0; top:280px; width:110%; background:#00ffff; box-shadow:0 0 5px #00ffff; --from:-8deg;  --to:25deg; --sw:1.9s; --blink:0.20s; animation-delay:0.07s;"></div>
  <div class="side-beam from-left" style="left:0; top:350px; width:110%; background:#ffff00; box-shadow:0 0 5px #ffff00; --from:-15deg; --to:18deg; --sw:2.8s; --blink:0.13s; animation-delay:0.12s;"></div>
  <div class="side-beam from-right" style="right:0; top:220px; width:110%; background:#ff4400; box-shadow:0 0 5px #ff4400; --from:-18deg; --to:12deg; --sw:2.1s; --blink:0.18s; animation-delay:0.09s;"></div>
  <div class="side-beam from-right" style="right:0; top:310px; width:110%; background:#aa00ff; box-shadow:0 0 5px #aa00ff; --from:-10deg; --to:22deg; --sw:2.6s; --blink:0.22s; animation-delay:0.04s;"></div>
  <div class="side-beam from-right" style="right:0; top:375px; width:110%; background:#00ff88; box-shadow:0 0 5px #00ff88; --from:-12deg; --to:16deg; --sw:3.1s; --blink:0.15s; animation-delay:0.18s;"></div>

  <!-- Speakers -->
  <canvas class="speaker-canvas" id="spk-left"></canvas>
  <canvas class="speaker-canvas" id="spk-right"></canvas>

  <!-- Cat DJ -->
  <img id="cat-dj" src="images/cat-dj.gif" alt="Cat DJ" />

  <!-- Disco floor -->
  <div id="disco-floor"></div>

  <!-- Crowd -->
  <div id="crowd-wrap">
    <canvas id="crowd1" class="crowd-canvas"></canvas>
    <canvas id="crowd2" class="crowd-canvas"></canvas>
  </div>

  <div id="controls">
    <button class="ctrl-btn" onclick="rainCats()">MAKE IT RAIN</button>
    <button class="ctrl-btn" onclick="addOneCat()">+ CAT</button>
    <button class="ctrl-btn" id="clear-btn" onclick="clearCats()">CLEAR FLOOR</button>
  </div>
</div>

<script>
const scene = document.getElementById('scene');
const floorEl = document.getElementById('disco-floor');

const BG_COLORS = ['#0d0020','#001a22','#1a1100','#1a0008','#00001a','#000','#000','#000','#0d001a','#001510','#000'];
setInterval(() => { scene.style.background = BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)]; }, 120);

const TILE_COLORS = ['#ff00ff','#00ffff','#ffff00','#ff4400','#00ff88','#ff0088','#8800ff','#0088ff','#ff8800','#fff','#44ff00','#ff0044','#ff66cc','#66ffff'];
const randomColor = () => TILE_COLORS[Math.floor(Math.random() * TILE_COLORS.length)];
for (let i = 0; i < 24; i++) {
  const t = document.createElement('div');
  t.className = 'floor-tile';
  t.style.background = randomColor();
  t.style.setProperty('--dur', (0.4 + Math.random() * 1.2).toFixed(2) + 's');
  t.style.setProperty('--del', (Math.random() * 1.5).toFixed(2) + 's');
  floorEl.appendChild(t);
}
setInterval(() => {
  document.querySelectorAll('.floor-tile').forEach(t => { if (Math.random() < 0.4) t.style.background = randomColor(); });
}, 300);

setInterval(() => {
  for (let i = 0; i < 2; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.background = randomColor();
    s.style.left = (28 + Math.random() * 44) + '%';
    s.style.top  = (105 + Math.random() * 30) + 'px';
    const sz = (3 + Math.random() * 5) + 'px';
    s.style.width = s.style.height = sz;
    scene.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}, 220);

// Draw image onto canvas removing grey/white bg
function drawWithBgRemoved(canvasId, src, threshold) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    canvas.width  = canvas.offsetWidth  || 260;
    canvas.height = canvas.offsetHeight || 340;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = id.data;
    const t = threshold || 80;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      const isGrey = Math.abs(r-g) < 35 && Math.abs(g-b) < 35 && Math.abs(r-b) < 35 && r > t;
      if (isGrey) d[i+3] = 0;
    }
    ctx.putImageData(id, 0, 0);
  };
  img.src = src;
}

drawWithBgRemoved('spk-left',  'images/speakers.png', 80);
drawWithBgRemoved('spk-right', 'images/speakers.png', 80);

// Crowd - dark bg image, keep only dark pixels as silhouette
function drawCrowd(canvasId, flip) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    canvas.width  = scene.offsetWidth || window.innerWidth;
    canvas.height = 420;
    ctx.save();
    if (flip) { ctx.scale(-1,1); ctx.drawImage(img, -canvas.width, 0, canvas.width, canvas.height); }
    else { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }
    ctx.restore();
    const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const brightness = (d[i] + d[i+1] + d[i+2]) / 3;
      if (brightness > 60) {
        d[i+3] = 0;
      } else {
        d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = 255;
      }
    }
    ctx.putImageData(id, 0, 0);
  };
  img.src = 'images/crowd.png';
}

drawCrowd('crowd1', false);
drawCrowd('crowd2', true);

// Cats
const CAT_URLS = ['images/cat1.png','images/cat2.png','images/cat3.png','images/cat4.png','images/cat5.png'];
const cats = [];
const GRAVITY = 0.38, BOUNCE = 0.52;

function spawnCat(startX) {
  const img = document.createElement('img');
  img.className = 'cat';
  img.src = CAT_URLS[Math.floor(Math.random() * CAT_URLS.length)];
  const x = startX ?? Math.random() * (scene.offsetWidth - 100);
  img.style.left = x + 'px'; img.style.top = '-100px';
  const cat = { el:img, x, y:-100, vx:(Math.random()-.5)*5, vy:1+Math.random()*2, dragging:false, lastX:0, lastY:0, throwVx:0, throwVy:0 };
  img.addEventListener('mousedown', e => { cat.dragging=true; cat.lastX=e.clientX; cat.lastY=e.clientY; e.preventDefault(); });
  img.addEventListener('touchstart', e => { cat.dragging=true; cat.lastX=e.touches[0].clientX; cat.lastY=e.touches[0].clientY; e.preventDefault(); }, {passive:false});
  scene.appendChild(img);
  cats.push(cat);
}
document.addEventListener('mousemove', e => {
  cats.forEach(cat => {
    if (!cat.dragging) return;
    const dx=e.clientX-cat.lastX, dy=e.clientY-cat.lastY;
    cat.throwVx=dx*0.6; cat.throwVy=dy*0.6;
    cat.x+=dx; cat.y+=dy;
    cat.el.style.left=cat.x+'px'; cat.el.style.top=cat.y+'px';
    cat.lastX=e.clientX; cat.lastY=e.clientY;
  });
});
document.addEventListener('touchmove', e => {
  cats.forEach(cat => {
    if (!cat.dragging) return;
    const dx=e.touches[0].clientX-cat.lastX, dy=e.touches[0].clientY-cat.lastY;
    cat.throwVx=dx*0.6; cat.throwVy=dy*0.6;
    cat.x+=dx; cat.y+=dy;
    cat.el.style.left=cat.x+'px'; cat.el.style.top=cat.y+'px';
    cat.lastX=e.touches[0].clientX; cat.lastY=e.touches[0].clientY;
  });
}, {passive:false});
document.addEventListener('mouseup',  () => { cats.forEach(c => { if(c.dragging){c.dragging=false;c.vx=c.throwVx;c.vy=c.throwVy;} }); });
document.addEventListener('touchend', () => { cats.forEach(c => { if(c.dragging){c.dragging=false;c.vx=c.throwVx;c.vy=c.throwVy;} }); });

function getFloorTop() {
  const floorEl = document.getElementById('disco-floor');
  if (!floorEl) return scene.offsetHeight - 200;
  const rect = floorEl.getBoundingClientRect();
  const sceneRect = scene.getBoundingClientRect();
  return rect.top - sceneRect.top;
}

function animate() {
  const W = scene.offsetWidth;
  const H = scene.offsetHeight;
  const floorTop = getFloorTop();

  cats.forEach(cat => {
    if (cat.dragging) return;
    cat.vy += GRAVITY;
    cat.x += cat.vx;
    cat.y += cat.vy;

    // Check if cat overlaps the disco floor (center x within floor bounds)
    const floorEl = document.getElementById('disco-floor');
    const floorRect = floorEl.getBoundingClientRect();
    const sceneRect = scene.getBoundingClientRect();
    const floorLeft = floorRect.left - sceneRect.left;
    const floorRight = floorRect.right - sceneRect.left;
    const catCenterX = cat.x + 45;

    const onFloor = catCenterX >= floorLeft && catCenterX <= floorRight;

    if (onFloor && cat.y + 90 >= floorTop && cat.vy > 0) {
      cat.y = floorTop - 90;
      cat.vy *= -BOUNCE;
      cat.vx *= 0.9;
      if (Math.abs(cat.vy) < 0.8) cat.vy = 0;
    }

    // Loop: if cat falls off bottom of screen, respawn at top
    if (cat.y > H + 10) {
      cat.y = -100;
      cat.x = Math.random() * (W - 90);
      cat.vx = (Math.random() - 0.5) * 5;
      cat.vy = 2 + Math.random() * 3;
    }

    if (cat.x < 0) { cat.x = 0; cat.vx *= -0.7; }
    if (cat.x > W - 90) { cat.x = W - 90; cat.vx *= -0.7; }

    cat.el.style.left = cat.x + 'px';
    cat.el.style.top  = cat.y + 'px';
  });
  requestAnimationFrame(animate);
}

function rainCats() { const n=5+Math.floor(Math.random()*5); for(let i=0;i<n;i++) setTimeout(()=>spawnCat(),i*160); }
function addOneCat() { spawnCat(); }
function clearCats() { cats.forEach(c=>c.el.remove()); cats.length=0; }

for (let i=0;i<3;i++) setTimeout(()=>spawnCat(),i*500);
animate();
</script>
</body>
</html>
